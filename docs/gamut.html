function makePane(host, key, showCube, tipEl) {
  const cv = document.createElement('canvas');
  host.appendChild(cv);
  const ctx = cv.getContext('2d');
  const d = DATA[key];
  let yaw = 0.7, pitch = 0.45, zoom = 1, drag = false, lx = 0, ly = 0;

  function resize() {
    const r = host.getBoundingClientRect();
    cv.width = r.width * devicePixelRatio;
    cv.height = r.height * devicePixelRatio;
    cv.style.width = r.width + 'px';
    cv.style.height = r.height + 'px';
    draw();
  }

  function proj(p) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    let x = p[0] * cy - p[2] * sy;
    let z = p[0] * sy + p[2] * cy;
    let y = p[1] * cp - z * sp;
    let z2 = p[1] * sp + z * cp;
    const dist = 4.0 / zoom;
    const f = 1.15 / Math.max(0.4, dist - z2);
    return {
      x: (cv.width / 2) + x * f * Math.min(cv.width, cv.height),
      y: (cv.height / 2) - y * f * Math.min(cv.width, cv.height),
      z: z2,
    };
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const S = Math.min(cv.width, cv.height);
    // 立方体线框
    if (showCube) {
      const c = [];
      for (let i = 0; i < 8; i++) c.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
      const E = [[0,1],[0,2],[1,3],[2,3],[4,5],[4,6],[5,7],[6,7],[0,4],[1,5],[2,6],[3,7]];
      ctx.strokeStyle = 'rgba(90,90,110,.55)';
      ctx.lineWidth = 1 * devicePixelRatio;
      for (const [a, b] of E) {
        const A = proj(c[a]), B = proj(c[b]);
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      }
    }
    // 凸包面（半透明，按平均深度排序）
    const faces = (d.faces || []).map(f => {
      const P = f.map(i => proj(d.pts[i]));
      return { P, z: (P[0].z + P[1].z + P[2].z) / 3 };
    }).sort((a, b) => a.z - b.z);
    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.P[0].x, f.P[0].y);
      ctx.lineTo(f.P[1].x, f.P[1].y);
      ctx.lineTo(f.P[2].x, f.P[2].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(74,150,190,.10)';
      ctx.fill();
    }
    // 凸包棱
    ctx.strokeStyle = 'rgba(90,209,255,.42)';
    ctx.lineWidth = 1.2 * devicePixelRatio;
    for (const [a, b] of d.edges) {
      const A = proj(d.pts[a]), B = proj(d.pts[b]);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
    // 点（远的先画）
    const order = d.pts.map((p, i) => [proj(p).z, i]).sort((x, y) => x[0] - y[0]);
    for (const [, i] of order) {
      const P = proj(d.pts[i]);
      const c = DATA.colors[i];
      const r = (2.6 + 2.2 * (P.z + 1) / 2) * devicePixelRatio;
      ctx.beginPath();
      ctx.arc(P.x, P.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      ctx.fill();
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.stroke();
    }
  }

  cv.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener('mouseup', () => { drag = false; });
  addEventListener('mousemove', e => {
    if (!drag) return;
    yaw += (e.clientX - lx) * 0.01;
    pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - ly) * 0.01));
    lx = e.clientX; ly = e.clientY;
    draw();
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.max(0.5, Math.min(3, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    draw();
  }, { passive: false });
  // 悬停显示色名
  cv.addEventListener('mousemove', e => {
    if (drag) return;
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) * devicePixelRatio, my = (e.clientY - r.top) * devicePixelRatio;
    let best = -1, bd = 1e9;
    d.pts.forEach((p, i) => {
      const P = proj(p);
      const dd = (P.x - mx) ** 2 + (P.y - my) ** 2;
      if (dd < bd) { bd = dd; best = i; }
    });
    if (best >= 0 && bd < (14 * devicePixelRatio) ** 2) {
      const c = DATA.colors[best];
      tipEl.textContent = DATA.names[best] + '  (' + c.join(',') + ')';
    } else tipEl.textContent = '';
  });
  addEventListener('resize', resize);
  resize();
}

const panes = document.querySelectorAll('.pane');
makePane(panes[0], 'rgb', true, document.getElementById('tip0'));
makePane(panes[1], 'lab', false, document.getElementById('tip1'));
</script></body></html>
